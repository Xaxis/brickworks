<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The mark: a cube with one corner cut away, the way a CAD section
    shows the inside of a solid. Three outer faces in yellow, red and
    blue, and the three faces of the cut a shade darker, so it reads as
    a hollow rather than as a second, smaller cube.

    Geometric on purpose: no brick, no studs (docs/TRADEMARKS.md,
    Decisions, 2026-10-13). It is the one source for every size:
    tools/web/make_icons.mjs draws the favicons and the app icon from it,
    on a dark tile where an icon needs a background, and the site's
    header shows it as it is.
  -->
  <path d="M32 4L56.25 18L44.125 25L32 18L19.875 25L7.75 18Z" fill="#f2cd37"/>
  <path d="M7.75 18L19.875 25V39L32 46V60L7.75 46Z" fill="#d0332f"/>
  <path d="M56.25 18L44.125 25V39L32 46V60L56.25 46Z" fill="#2a6fc4"/>
  <path d="M32 46L44.125 39L32 32L19.875 39Z" fill="#c29d22"/>
  <path d="M44.125 25L32 18V32L44.125 39Z" fill="#94211e"/>
  <path d="M19.875 25L32 18V32L19.875 39Z" fill="#1c4b88"/>
</svg>
