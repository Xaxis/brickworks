[project]
name = "lego-emulator-tools"
version = "0.1.0"
description = "Offline data pipeline: LDraw geometry, catalogue, connectivity"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
include = ["tools", "tests"]
extraPaths = ["tools"]
reportMissingImports = "warning"
