# Prove a desktop release on the systems it is for.
#
# This runs in Xaxis/brickworks-releases, the public repository the
# releases live in, not in the source: Actions are free on a public
# repository, and macOS minutes cost ten times Linux's on a private one.
# Its copy here is the one to edit; tools/release/releases_repo.sh put it
# there, and a change goes there by hand.
#
# The packages are built by tools/release.py on a machine that has the part
# library: a gigabyte of geometry that is not in git and takes ninety minutes
# to rebuild, so building here would cost more than it proves. What only a
# runner can prove is that each package starts on its own system: a Mac,
# Windows, and a stock Ubuntu for the .deb, whose dependencies only a clean
# system proves. Linux is the machine that built it, and docs/RELEASING.md
# smokes the AppImage and the tar.xz there before the upload.
#
# So this downloads what was uploaded to a release here and installs each
# package the way a person would, into a clean home: the disk image mounted
# and its app copied to /Applications, the installer run silently, as the
# updater runs it. tools/release.py smoke asks it which build it is, opens
# the example model and writes it back, has a session place bricks in it
# over MCP, opens a model of each kind given as a double-click gives it, and
# double-clicks two (Launch Services on a Mac, the shell on Windows, GIO on
# Ubuntu), the second with the app open; on Windows it then uninstalls it.
# On Ubuntu apt installs the .deb too, and removes it. macos-15-intel is a
# VM whose only GPU MoltenVK cannot draw on, so its double-clicks say "not
# run here" and why; Apple silicon's run the same app's Launch Services
# path. The zips the
# disk image and the installer replaced are run too while a release has
# them (docs/DISTRIBUTION.md). Those
# tools are the source's, checked out from Xaxis/brickworks: once that is
# private, with BRICKWORKS_SOURCE_TOKEN, a fine-grained token that reads
# that one repository's contents and nothing else.
#
# Run it on the draft, before publishing (docs/RELEASING.md):
#   gh workflow run release.yml -R Xaxis/brickworks-releases -f tag=v0.1.0
# Only then: publishing changes no file, so it is not run again.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check, e.g. v0.1.0. A draft works."
        required: true

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

# Write, though nothing here writes: GitHub lists a draft release only to a
# token that could push, and checking the draft is the point.
permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS, Apple silicon", os: macos-15, pattern: "*-macos-universal.*" }
          - { name: "macOS, Intel", os: macos-15-intel, pattern: "*-macos-universal.*" }
          - { name: "Windows", os: windows-2022, pattern: "*-windows-x86_64*" }
          - { name: "Ubuntu", os: ubuntu-24.04, pattern: "*-linux-amd64.deb" }
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # Windows pipes Python's output as cp1252 otherwise, and the tool's
      # headings are not in it.
      PYTHONUTF8: "1"
    steps:
      # The source's tools at its main, not at the tag: the tag here is on
      # this repository's README, and a draft's does not exist yet.
      - uses: actions/checkout@v4
        with:
          repository: Xaxis/brickworks
          token: ${{ secrets.BRICKWORKS_SOURCE_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the package
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "dist/$version"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "dist/$version" \
            --pattern "${{ matrix.pattern }}" --pattern SHA256SUMS
          ls -l "dist/$version"

      # A runner has no desktop: Xvfb to draw on, and what a desktop has to
      # say which app opens a file (GIO, the shared MIME database, xdg-utils).
      - name: What a desktop needs to open a file and draw a window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdg-utils desktop-file-utils \
            libglib2.0-bin shared-mime-info mesa-vulkan-drivers libgl1-mesa-dri >/dev/null

      - name: It is what was built
        run: python tools/release.py inspect "dist/$VERSION"

      # The disk image and the installer first: the zip's run comes after,
      # so the app in /Applications and the install folder are the zips'
      # own clean ones by then.
      - name: Installed as a person installs it, it starts, opens models and takes bricks
        run: |
          for package in $(ls dist/"$VERSION"/Brickworks-*.dmg dist/"$VERSION"/Brickworks-*-setup.exe \
                              dist/"$VERSION"/Brickworks-*.deb dist/"$VERSION"/Brickworks-*.zip 2>/dev/null); do
            python tools/release.py smoke "$package" --expect="$VERSION"
          done

      # The smoke unpacks the .deb into a clean home; this is apt's own
      # install on the whole system. A package's "./" entry once carried the
      # build's umask, which dpkg can give to /, so / is checked too.
      - name: apt installs it, the system opens models with it, and apt removes it
        if: runner.os == 'Linux'
        run: |
          before=$(stat -c %a /)
          sudo apt-get install -y ./dist/"$VERSION"/Brickworks-*-linux-amd64.deb
          echo "/ was $before, is $(stat -c %a /)"
          [ "$(stat -c %a /)" = "$before" ]
          dpkg -s brickworks | grep -E '^(Status|Version)'
          readlink -f /usr/bin/brickworks
          for type in application/x-ldraw application/x-multi-part-ldraw \
                      application/x-bricklink-studio application/x-lxf; do
            echo "$type: $(xdg-mime query default "$type")"
            [ "$(xdg-mime query default "$type")" = dev.brickworks.app.desktop ]
          done
          brickworks --headless -- --about | grep '^Brickworks '
          sudo apt-get remove -y brickworks
          for left in /usr/lib/brickworks /usr/bin/brickworks \
                      /usr/share/applications/dev.brickworks.app.desktop; do
            if [ -e "$left" ] || [ -L "$left" ]; then echo "apt remove left $left"; exit 1; fi
          done
          echo "removed: no /usr/lib/brickworks, /usr/bin/brickworks or menu entry left"

      - name: macOS accepts its signature
        if: runner.os == 'macOS'
        run: |
          image=$(ls dist/"$VERSION"/*-macos-universal.dmg)
          hdiutil verify "$image"
          mkdir -p "$RUNNER_TEMP/mac"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mac" "$image"
          app="$RUNNER_TEMP/mac/Brickworks.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/Brickworks"
          # Informational: an ad-hoc signature is rejected here by design,
          # and that is the Open Anyway the download page describes.
          spctl --assess --type execute --verbose=4 "$app" || true
          spctl --assess --type open --context context:primary-signature --verbose=4 "$image" || true
          hdiutil detach "$RUNNER_TEMP/mac"
          # And still valid once copied to /Applications, as the smoke did.
          codesign --verify --deep --strict --verbose=2 /Applications/Brickworks.app

      # What a person sees when they open the disk image: its window, laid
      # out by its .DS_Store over the background, kept with the run.
      - name: The disk image's window
        if: runner.os == 'macOS'
        run: |
          image=$(ls dist/"$VERSION"/*-macos-universal.dmg)
          open "$image"
          for _ in $(seq 1 30); do [ -d /Volumes/Brickworks ] && break; sleep 1; done
          sleep 5
          osascript -e 'tell application "Finder" to get bounds of front window' || true
          mkdir -p shots
          screencapture -x "shots/dmg-window-${{ matrix.os }}.png" || true
          hdiutil detach /Volumes/Brickworks || true

      - name: What Windows makes of its signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "dist/$env:VERSION" -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0}: {1}, version {2}" -f $_.Name, $s.Status, $_.VersionInfo.ProductVersion
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots/
          if-no-files-found: ignore
